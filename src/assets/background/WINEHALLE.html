        border-radius: 8px;

        background-color: #f2f4f6;
        color: #4e5968;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
      }

      .btn.primary {
        background-color: #3282f6;
        color: #f9fcff;
      }

      .text-center {
        text-align: center;
      }

      .flex {
        display: flex;
      }

      .flex-column {
        display: flex;
        flex-direction: column;
      }

      .justify-center {
        justify-content: center;
      }

      .justify-between {
        justify-content: space-between;
      }

      .align-center {
        align-items: center;
      }

      .confirm-loading {
        margin-top: 72px;
        height: 400px;
        justify-content: space-between;
      }

      .confirm-success {
        display: none;
        margin-top: 72px;
      }

      .button-group {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
      }

      .title {
        margin-top: 32px;
        margin-bottom: 0;
        color: #191f28;
        font-weight: bold;
        font-size: 24px;
      }

      .description {
        margin-top: 8px;
        color: #4e5968;
        font-size: 17px;
        font-weight: 500;
      }

      .response-section {
        margin-top: 60px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        font-size: 20px;
      }

      .response-section .response-label {
        font-weight: 600;
        color: #333d48;
        font-size: 17px;
      }

      .response-section .response-text {
        font-weight: 500;
        color: #4e5968;
        font-size: 17px;
        padding-left: 16px;
        word-break: break-word;
        text-align: right;
      }

      .color-grey {
        color: #b0b8c1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="background-wrapper">
        <div class="main-layout">
          <div
            class="min-w-[800px] h-[120px] flex items-center justify-between mx-8 my-4 border-b"
          >
            <div class="flex items-center gap-8">
              <img
                class="w-24 h-24 rounded hover:scale-105 hover:cursor-pointer transition duration-200 ease-in-out shadow-sm"
                alt="로고 이미지"
                src="./WINEHALLE_files/logo-Image.png"
              /><strong
                class="text-[40px] italic transition-all duration-200 ease-in-out cursor-pointer hover:scale-105 hover:text-[#7B0033] hover:drop-shadow-lg"
                >WINEHALLE</strong
              >
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex items-end gap-12 font-medium italic text-xl">
                <span
                  class="cursor-pointer transition-all duration-200 ease-in-out cursor-pointer hover:scale-105 hover:text-[#7B0033]"
                  >Login</span
                ><span
                  class="cursor-pointer transition-all duration-200 ease-in-out cursor-pointer hover:scale-105 hover:text-[#7B0033]"
                  >Sign Up</span
                >
              </div>
            </div>
          </div>
          <main style="min-height: calc(-120px + 100vh)">
            <div class="flex justify-center items-center">
              <form
                class="min-w-[400px] flex flex-col gap-4 w-full max-w-md p-8 bg-white rounded-xl shadow-md"
              >
                <p class="italic text-3xl font-bold text-center mb-4">
                  Sign Up
                </p>
                <div>
                  <label
                    for="username"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >아이디</label
                  >
                  <div class="flex gap-2 justify-between items-center">
                    <input
                      id="username"
                      placeholder="아이디를 입력해주세요"
                      class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                      type="text"
                    /><button
                      class="w-1/4 px-4 py-2 border border-[#6A1B1A] rounded-md bg-[#6A1B1A] text-white whitespace-nowrap hover:bg-[#8B2E2E] hover:border-[#8B2E2E] transition-colors duration-150"
                    >
                      <span>중복 확인</span>
                    </button>
                  </div>
                </div>
                <div>
                  <label
                    for="password"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >비밀번호</label
                  ><input
                    id="password"
                    placeholder="비밀번호를 입력해주세요"
                    class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                    type="password"
                  />
                </div>
                <div>
                  <label
                    for="pwForConfirming"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >비밀번호 확인</label
                  ><input
                    id="pwForConfirming"
                    placeholder="비밀번호를 다시 입력해주세요"
                    class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                    type="password"
                  />
                </div>
                <div>
                  <label
                    for="name"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >사용자 이름</label
                  ><input
                    id="name"
                    placeholder="이름을 입력해주세요"
                    class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                    type="text"
                  />
                </div>
                <div>
                  <label
                    for="email"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >이메일 주소</label
                  >
                  <div class="flex gap-2 justify-between items-center">
                    <input
                      id="email"
                      placeholder="메일 주소를 입력해주세요"
                      class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                      type="email"
                    /><button
                      class="w-1/4 px-4 py-2 border border-[#6A1B1A] rounded-md bg-[#6A1B1A] text-white whitespace-nowrap hover:bg-[#8B2E2E] hover:border-[#8B2E2E] transition-colors duration-150"
                    >
                      <span>중복 확인</span>
                    </button>
                  </div>
                </div>
                <div>
                  <label
                    for="phone"
                    class="block mb-1 text-sm font-medium text-gray-700"
                    >전화번호</label
                  >
                  <div class="flex gap-2 justify-between items-center">
                    <input
                      id="phone"
                      placeholder="전화번호를 입력해주세요"
                      class="w-full p-2 border border-[#D4D4D4] rounded-md focus:outline-none focus:ring focus:ring-1 focus:ring-[#6A1B1A]"
                      type="tel"
                    /><button
                      class="w-1/4 px-4 py-2 border border-[#6A1B1A] rounded-md bg-[#6A1B1A] text-white whitespace-nowrap hover:bg-[#8B2E2E] hover:border-[#8B2E2E] transition-colors duration-150"
                    >
                      <span>중복 확인</span>
                    </button>
                  </div>
                </div>
                <button
                  type="submit"
                  class="mt-4 py-2 bg-[#6A1B1A] text-white font-semibold rounded-md hover:bg-[#4E1212] transition"
                >
                  회원 가입
                </button>
                <div class="text-center">
                  <span class="text-sm text-gray-600"
                    >이미 계정이 있으신가요? </span
                  ><a
                    class="text-sm text-[#6A1B1A] hover:underline font-medium"
                    href="http://localhost:5173/login"
                    data-discover="true"
                    >로그인</a
                  >
                </div>
              </form>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="./WINEHALLE_files/main.tsx"></script>
  </body>
</html>
